name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Required. Typecheck, unit tests, the real-Postgres tests, and a blocking audit of what ships.
  ci:
    name: ci
    runs-on: ubuntu-latest
    # A throwaway Postgres for tests/db. It exists only for this job and holds only fake data.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: example-ci-throwaway
          POSTGRES_DB: cargodev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cargodev_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Dummy values only. Never put real secrets in CI for a public repo.
      NODE_ENV: test
      PORT: "4000"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_dummy"
      MOBILE_JWT_SECRET: "ci-dummy-value-not-for-real-use-0123456789"
      ORG_ID: "org_ci_dummy"
      TRUST_PROXY_HOPS: "0"
      SSE_MAX_CONNECTIONS: "50"
      DAILY_JOB_UTC_HOUR: "2"
      SCHEDULER_ENABLED: "false"
      # The ONLY database the tests touch. The harness refuses anything but localhost or
      # this service container, and never reads DATABASE_URL.
      TEST_DATABASE_URL: "postgresql://postgres:example-ci-throwaway@localhost:5432/cargodev_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vitest 5 needs Node 22.12 or newer.
          node-version: 24
          cache: npm
      - run: npm ci
      # Generates the typed Prisma client; typecheck and tests need it. Does not touch a database.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      # Real Postgres: serial concurrency, advisory locks, NULL semantics, vehicle SQL.
      - run: npm run test:db
      # Blocking: a high or critical finding in a runtime dependency fails the build.
      - run: npm audit --omit=dev --audit-level=high

  # Required. Same scan as the pre-commit hook (scripts/secret-scan.sh), run over
  # every tracked file, because `git commit --no-verify` skips local hooks.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files | sh scripts/secret-scan.sh

  # Report only. Shows the full tree (including dev tools) without blocking merges.
  # Review it; dev-only findings with no fix go in "Accepted risks" in docs/security-model.md.
  audit-report:
    name: audit-report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit
