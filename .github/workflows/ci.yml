# Place this file at .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      # Dummy values only. Never put real secrets in CI for a public repo.
      NODE_ENV: test
      PORT: "4000"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_dummy"
      MOBILE_JWT_SECRET: "ci-dummy-value-not-for-real-use-0123456789"
      ORG_ID: "org_ci_dummy"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
